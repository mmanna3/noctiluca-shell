name: Backup diario a Google Drive

on:
  schedule:
    - cron: "0 3 * * *" # 00:00 Argentina (UTC-3)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: "0a - Limpiar backups locales previos (si quedaron de un run fallido)"
        run: |
          code=$(curl -sSL -o "$RUNNER_TEMP/body" -w "%{http_code}" -X DELETE \
            -H "X-Api-Key: ${{ secrets.BACKUP_API_KEY }}" \
            "${{ vars.API_URL }}/api/backup/limpiar-backups-locales")
          cat "$RUNNER_TEMP/body"
          echo "HTTP $code"
          [ "$code" -lt 400 ]

      - name: "0b - Validar archivos locales (máx 2)"
        run: |
          code=$(curl -sSL -o "$RUNNER_TEMP/body" -w "%{http_code}" \
            -H "X-Api-Key: ${{ secrets.BACKUP_API_KEY }}" \
            "${{ vars.API_URL }}/api/backup/validar-archivos-locales")
          cat "$RUNNER_TEMP/body"
          echo "HTTP $code"
          [ "$code" -lt 400 ]

      - name: "1 - Generar backup BD en disco"
        run: |
          code=$(curl -sSL -o "$RUNNER_TEMP/body" -w "%{http_code}" \
            -H "X-Api-Key: ${{ secrets.BACKUP_API_KEY }}" \
            "${{ vars.API_URL }}/api/backup/guardar-backup-bd-en-disco")
          cat "$RUNNER_TEMP/body"
          echo "HTTP $code"
          [ "$code" -lt 400 ]

      - name: "2 - Rotar backups en Drive (borra el más viejo si hay más de 3 días)"
        run: |
          code=$(curl -sSL -o "$RUNNER_TEMP/body" -w "%{http_code}" \
            -H "X-Api-Key: ${{ secrets.BACKUP_API_KEY }}" \
            "${{ vars.API_URL }}/api/backup/rotar-backups-en-drive")
          cat "$RUNNER_TEMP/body"
          echo "HTTP $code"
          [ "$code" -lt 400 ]

      - name: "3 - Subir backup BD a Drive"
        run: |
          code=$(curl -sSL -o "$RUNNER_TEMP/body" -w "%{http_code}" \
            -H "X-Api-Key: ${{ secrets.BACKUP_API_KEY }}" \
            "${{ vars.API_URL }}/api/backup/subir-backup-bd-a-drive")
          cat "$RUNNER_TEMP/body"
          echo "HTTP $code"
          [ "$code" -lt 400 ]

      - name: "4 - Limpiar backups locales"
        if: always()
        run: |
          code=$(curl -sSL -o "$RUNNER_TEMP/body" -w "%{http_code}" -X DELETE \
            -H "X-Api-Key: ${{ secrets.BACKUP_API_KEY }}" \
            "${{ vars.API_URL }}/api/backup/limpiar-backups-locales")
          cat "$RUNNER_TEMP/body"
          echo "HTTP $code"
          [ "$code" -lt 400 ]
